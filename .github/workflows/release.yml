name: Release

# Builds the Chrome, Edge and Firefox zips and attaches them to one GitHub
# Release. Push a tag matching package.json's version, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# No store submission yet — the zips are for "Load unpacked" sideloading or
# a manual store dashboard upload.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - run: pnpm package:chrome
      - run: pnpm package:edge
      - run: pnpm package:firefox

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          files: apps/extension/.output/*.zip
